{{- with .Values.image.pullSecrets }}
{{- if and .name .namespace }}
{{- $existing := (lookup "v1" "Secret" $.Release.Namespace .name) }}
{{- if not $existing }}
{{- $src := (lookup "v1" "Secret" .namespace .name) }}
{{- if not $src }}
{{- fail (printf "Secret %q not found in namespace %q (and not present in release namespace %q). Create it first or copy it manually." .name .namespace $.Release.Namespace) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/copied-from-namespace: {{ .namespace | quote }}
type: {{ $src.type }}
data:
{{ toYaml $src.data | indent 2 }}
{{- end }}
{{- end }}
{{- end }}
